plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.propdf.security'
    compileSdk 34

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation project(':core')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Fragment/Activity KTX (required by SecurityActivity.kt, all fragments — viewModels/activityViewModels delegates)
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // RecyclerView + ListAdapter/DiffUtil (required by HistoryAdapter.kt, RedactionAdapter.kt, HistoryDialogFragment.kt, RedactionFragment.kt)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ViewPager2 (required by SecurityActivity.kt, SecurityPagerAdapter.kt)
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Material Components (required by MaterialToolbar, MaterialButton, MaterialCheckBox, TextInputLayout,
    // TextInputEditText, MaterialAlertDialogBuilder, Snackbar, TabLayout, TabLayoutMediator, MaterialCardView)
    implementation 'com.google.android.material:material:1.11.0'

    // ConstraintLayout (required by RedactionFragment.kt)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Security-crypto (required by SecurityUtils.kt — MasterKey, EncryptedFile)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Biometric authentication (required by BiometricAuthManager)
    implementation 'androidx.biometric:biometric:1.1.0'

    // ViewModel + viewModelScope (required for SecurityViewModel)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Compose (required by BiometricGuard.kt, SecuritySettingsScreen.kt)
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'

    // Room (required by SecurityDatabase, RedactionDao, SecureDocumentDao, SecurityOperationDao)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // WorkManager (required by @HiltWorker: SecurityWorker)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.hilt:hilt-work:1.1.0'
    kapt 'androidx.hilt:hilt-compiler:1.1.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // iText7 for PDF encryption, redaction, watermark
    implementation 'com.itextpdf:kernel:7.2.5'
    implementation 'com.itextpdf:io:7.2.5'
    implementation 'com.itextpdf:layout:7.2.5'
    implementation 'com.itextpdf:forms:7.2.5'

    // BouncyCastle — use jdk15to18 (unified by root build.gradle resolution strategy)
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.72'

    testImplementation 'junit:junit:4.13.2'
}
