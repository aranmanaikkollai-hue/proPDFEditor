plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.propdf.editor'
    compileSdk 34

    defaultConfig {
        applicationId "com.propdf.editor"
        minSdk 23
        targetSdk 34
        versionCode 30
        versionName "3.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
        buildConfig true
        viewBinding true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// NOTE: KSP incremental compilation is disabled via the `ksp.incremental=false`
// project property in gradle.properties (see comment there), not via this
// extension — KspExtension has no settable `incremental` property, and doing
// `ksp { incremental = false }` here fails with:
//   "Could not set unknown property 'incremental' for extension 'ksp'
//    of type com.google.devtools.ksp.gradle.KspExtension."

kapt {
    correctErrorTypes = true
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    // Material Components (XML themes - required for Theme.Material3.* parents)
    implementation 'com.google.android.material:material:1.11.0'

    // Fragment/ViewPager2/RecyclerView (required by com.propdfeditor.ui.signature.* activities/fragments/adapters)
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.animation:animation'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Hilt
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
    
    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.hilt:hilt-work:1.1.0'
    kapt 'androidx.hilt:hilt-compiler:1.1.0'
    
    // Serialization (required by PageEditorViewModel.kt, SmartFolderEngine.kt)
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'
    
    // PDF
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation('com.itextpdf:itext7-core:7.2.5') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    }

    // Markdown parsing (required by MarkdownConverter.kt)
    implementation 'org.commonmark:commonmark:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'

    // JSON (required by BatchWorkScheduler.kt and batch workers)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Logging (required by PdfProcessor.kt, BatchViewModel.kt, BaseBatchWorker.kt, batch workers)
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // CameraX (required by DocumentScannerActivity.kt, ModernScannerActivity.kt)
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ML Kit OCR (required by OcrManager.kt, batch OcrWorker.kt)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Coroutines-Guava interop (required by ConversionWorker.kt's kotlinx.coroutines.guava.await)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.7.3'

    // Coroutines-Play Services interop (required by OcrWorker.kt's kotlinx.coroutines.tasks.await)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Navigation Fragment (required by ConversionFragment.kt's findNavController)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'

    // Commons Compress (required by ZipExporter.kt)
    implementation 'org.apache.commons:commons-compress:1.26.0'

    // DataStore Preferences (required by SettingsDataStore.kt)
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    
    // OpenCV (required by ScannerProcessor.kt)
    implementation 'org.opencv:opencv:4.10.0'
    
    // Image
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Glide (required by SignatureListAdapter.kt)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // Icons
    implementation 'androidx.compose.material:material-icons-extended'
    
    // Window
    implementation 'androidx.window:window:1.2.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    
    // Project modules
    implementation project(':core')
    implementation project(':editor')
    implementation project(':annotations')
    implementation project(':scanner')
    implementation project(':security')
    implementation project(':storage')
    implementation project(':sync')
    implementation project(':backup')
    implementation project(':ocr')
}
