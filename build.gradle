// Root build.gradle
// AGP aligned to 8.2.2 (matches settings.gradle)
// Kotlin 1.9.22 matches Compose Compiler 1.5.8 requirement
// KSP replaces kapt project-wide (see per-module build.gradle files), EXCEPT for
// the Hilt annotation processors specifically. Modules that use both Room and
// Hilt via ksp hit a real upstream bug (google/dagger#4161): when Room's KSP
// processor triggers a second processing round, Hilt's KSP integration tries to
// re-emit files (e.g. hilt_aggregated_deps/*.java) it already wrote in round 1,
// throwing kotlin.io.FileAlreadyExistsException. kapt does not share KSP's
// round model, so the Hilt compiler artifacts are applied via kapt in those
// modules as a workaround, while Room and everything else stays on ksp.
    defaultConfig {
        applicationId "com.propdfeditor"
        minSdk 23
        targetSdk 34
        versionCode 31
        versionName "3.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Enable Room schema export for migrations
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '1.9.22' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22' apply false
    id 'com.google.devtools.ksp' version '1.9.22-1.0.17' apply false
    id 'com.google.dagger.hilt.android' version '2.51.1' apply false
      id 'com.android.application' version '8.2.2' apply false
    id 'com.android.library' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    id 'com.google.devtools.ksp' version '1.9.22-1.0.17' apply false
    id 'com.google.dagger.hilt.android' version '2.51.1' apply false
    id 'com.google.gms.google-services' version '4.4.1' apply false
    id 'com.google.firebase.crashlytics' version '2.9.9' apply false
    id 'androidx.baselineprofile' version '1.2.3' apply false
}
// Dependency verification task
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                lint {
                    checkDependencies true
                    abortOnError false
                }
allprojects {
    configurations.all {
        def legacySuffix = 'jdk15' + 'on'
        def legacyBcprov = "bcprov-${legacySuffix}"
        def legacyBcpkix = "bcpkix-${legacySuffix}"

        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.bouncycastle') {
                if (details.requested.name == legacyBcprov) {
                    details.useTarget(
                        group: 'org.bouncycastle',
                        name: 'bcprov-jdk15to18',
                        version: '1.72'
                    )
                    details.because 'Unify BouncyCastle — jdk15to18 is the superset used by pdfbox-android'
                } else if (details.requested.name == legacyBcpkix) {
                    details.useTarget(
                        group: 'org.bouncycastle',
                        name: 'bcpkix-jdk15to18',
                        version: '1.72'
                    )
                    details.because 'Unify BouncyCastle PKIX variant to match pdfbox-android'
                }
            }
        }
        exclude group: 'org.bouncycastle', module: legacyBcprov
        exclude group: 'org.bouncycastle', module: legacyBcpkix
    }
}
