# Project-wide Gradle settings — Optimized for build speed and memory
# NOTE: CI runs on GitHub Actions ubuntu-latest, which has only 7GB total RAM.
# Xmx6g left almost no headroom for the OS, Kotlin/KSP daemon, and the native
# AAPT2 linking process, causing AAPT2's daemon to be OOM-killed with no
# diagnostic ("Unexpected error during link"). Lowered to leave real headroom.
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.stdlib.default.dependency=false

# The build log shows Gradle reusing a persistent Kotlin compile daemon
# across all ~12 library modules within a single CI run (--no-daemon only
# disables the *Gradle* daemon, not Kotlin's separate compiler daemon).
# By the time the build reaches :app -- the one module whose kapt stub
# generation must resolve the combined classpath of every other module --
# that daemon has been alive for 5+ minutes and processed a dozen other
# modules' worth of state first. This forces each Kotlin compile task to
# run in-process instead, eliminating any possibility of stale/accumulated
# daemon state carrying over between modules within the same build.
kotlin.compiler.execution.strategy=in-process

# KAPT optimizations
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
kapt.classloaders.cache.size=5

# KSP: disable incremental processing. Works around a known KSP/Hilt bug
# (google/ksp#1610) where, combined with Gradle's build cache, the Hilt
# "aggregated deps" processor can try to regenerate a hilt_aggregated_deps/*.java
# file that a stale cached task output already produced, raising
# kotlin.io.FileAlreadyExistsException. This is the correct/supported way to set
# it (a project property), not `ksp { incremental = false }` in build.gradle —
# KspExtension has no such settable property.
ksp.incremental=false

# Build performance
android.enableR8.fullMode=true
