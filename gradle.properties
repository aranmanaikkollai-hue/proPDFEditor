# Project-wide Gradle settings — Optimized for build speed and memory
# NOTE: CI runs on GitHub Actions ubuntu-latest, which has only 7GB total RAM.
# Xmx6g left almost no headroom for the OS, Kotlin/KSP daemon, and the native
# AAPT2 linking process, causing AAPT2's daemon to be OOM-killed with no
# diagnostic ("Unexpected error during link"). Lowered to leave real headroom.
#
# MaxMetaspaceSize was raised after a confirmed "ERROR: Metaspace"
# (OutOfMemoryError: Metaspace) failure in
# :security:kaptGenerateStubsDebugKotlin / :editor:kaptGenerateStubsDebugKotlin.
# Metaspace is off-heap, so this doesn't reduce the -Xmx3g heap headroom.
#
# IMPORTANT: the Kotlin compile daemon is a SEPARATE JVM process from the
# Gradle daemon, and by default inherits these same -Xmx/-XX:MaxMetaspaceSize
# values (confirmed in CI logs: the Kotlin daemon was launched with the exact
# same "-Xmx3g -XX:MaxMetaspaceSize=1024m" as Gradle's own daemon). That means
# two full-size JVMs plus two AAPT2 daemon processes were all competing for
# memory on a 7GB runner -- likely causing the OS to silently kill/starve the
# Kotlin daemon, which Gradle then reports as a generic "Could not load
# module <Error module>" rather than a clean OOM.
#
# kotlin.daemon.jvmargs below gives the Kotlin daemon (where the actual
# kapt/Hilt/Room annotation processing and Metaspace pressure happens) its
# own separate, larger Metaspace budget, while Gradle's own orchestration
# JVM keeps a smaller one -- rather than doubling both to 1024m and making
# the total footprint worse, as the first attempt at this fix did.
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin
kotlin.code.style=official
kotlin.stdlib.default.dependency=false

# KAPT optimizations
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
# kapt.classloaders.cache.size was 5. Removed after a confirmed CI failure:
# ":viewer:kaptDebugKotlin FAILED" with "duplicate class: com.propdf.viewer.model.Tile"
# (and 8 other plain, non-annotated classes in :viewer -- model/util/rendering/preload
# packages) during kapt stub compilation, with zero duplicate .kt source files anywhere
# in the repo (verified) and org.gradle.caching=true. With org.gradle.parallel=false,
# every module's kapt task runs sequentially inside the one long-lived build, and this
# property makes kapt cache/reuse annotation-processor classloaders ACROSS those
# sequential kapt invocations (app, core, editor, scanner, security, then viewer, in
# task-graph order) rather than one classloader per module. Kotlin's kapt has a known
# class of bug where a cached/reused processor classloader from an earlier module's kapt
# run bleeds stale class definitions into a later module's stub-compile, surfacing as
# exactly this "duplicate class" error for unrelated plain classes -- which matches this
# failure far better than an actual source duplication (there is none) or a stale build
# cache (clean + --no-build-cache were both already in effect, so neither applies here).
# This property defaults to 0 (disabled) when absent; removing it costs some kapt speed
# across modules, not correctness. NOT independently re-run against CI to confirm this
# specific property was the cause -- if :viewer's kapt still fails after this, the
# properties below (kapt.use.worker.api, kapt.include.compile.classpath) are the next
# ones to try disabling one at a time, since they touch the same kapt-worker-reuse path.
kapt.classloaders.cache.size=0

# KSP: disable incremental processing. Works around a known KSP/Hilt bug
# (google/ksp#1610) where, combined with Gradle's build cache, the Hilt
# "aggregated deps" processor can try to regenerate a hilt_aggregated_deps/*.java
# file that a stale cached task output already produced, raising
# kotlin.io.FileAlreadyExistsException. This is the correct/supported way to set
# it (a project property), not `ksp { incremental = false }` in build.gradle —
# KspExtension has no such settable property.
ksp.incremental=false

# Build performance
android.enableR8.fullMode=true
