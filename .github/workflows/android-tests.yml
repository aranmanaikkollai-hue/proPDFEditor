name: Android Tests (manual)

# Phase 9: runs the existing JVM unit tests and the instrumented suites (including the regression corpus tests)
# on an emulator and uploads the real reports. Manual trigger only, so it cannot break the normal build.
# UNTESTED: this workflow was written without the ability to run it; first run may need adjustment.
# It does not change any Gradle/AGP/Kotlin version and does not touch android.yml.
on:
  workflow_dispatch:

# shell: bash => `bash -eo pipefail`, so failures on the left of `| tee` are not masked.
defaults:
  run:
    shell: bash

jobs:
  release-tools-selftest:
    # Pure Python, no Android: iText scanner, lint gate, dependency-insight classifier, test-result summariser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: python3 -W ignore -m unittest discover -s tools/release -p 'test_*.py' -v

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record commit and source-tree fingerprint
        run: |
          # Hash BEFORE creating any output file inside the tree. `| tee reports/source-identity.txt` created that
          # file first, so the earlier fingerprint included a half-written output file (wrong, run-dependent).
          IDENT="$RUNNER_TEMP/source-identity.txt"
          {
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            python3 tools/release/source_fingerprint.py .
          } > "$IDENT"
          mkdir -p reports
          cp "$IDENT" reports/source-identity.txt
          cat "$IDENT"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: JVM unit tests (all modules; keep going so every failure is reported)
        run: ./gradlew testDebugUnitTest --continue --no-daemon --stacktrace
      - name: Summarise unit test results (no reports is NOT a pass)
        if: always()
        run: python3 tools/release/summarize_test_results.py . --require-modules app,core --out reports/unit-summary.txt
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            reports/
            **/build/reports/tests/
            **/build/test-results/

  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record commit and source-tree fingerprint
        run: |
          # Hash BEFORE creating any output file inside the tree. `| tee reports/source-identity.txt` created that
          # file first, so the earlier fingerprint included a half-written output file (wrong, run-dependent).
          IDENT="$RUNNER_TEMP/source-identity.txt"
          {
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            python3 tools/release/source_fingerprint.py .
          } > "$IDENT"
          mkdir -p reports
          cp "$IDENT" reports/source-identity.txt
          cat "$IDENT"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Generate regression corpus into androidTest assets
        # The generated corpus (app/src/androidTest/assets/corpus) is not committed, so the instrumented tests
        # (AnnotationFlatten, ViewerPasswordPremises, UnicodeAndSearchable, SafMatrix) need it created here.
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf fonts-freefont-ttf fonts-dejavu-core
          pip install reportlab pikepdf pypdfium2 pillow cryptography
          python3 tools/corpus/make_corpus.py app/src/androidTest/assets/corpus
          python3 tools/corpus/verify_corpus.py app/src/androidTest/assets/corpus
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on emulator (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          # Only modules that actually contain instrumented tests. Running connectedDebugAndroidTest on every module
          # crashed the emulator runner for modules with no tests ("Unable to instantiate instrumentation:
          # androidx.test.runner.AndroidJUnitRunner not found" in CI, Oct 2026).
          script: ./gradlew :app:connectedDebugAndroidTest :core:connectedDebugAndroidTest :viewer:connectedDebugAndroidTest --continue --no-daemon --stacktrace
      - name: Summarise instrumented test results (no reports is NOT a pass)
        if: always()
        run: python3 tools/release/summarize_test_results.py . --require-modules app,core,viewer --out reports/instrumented-summary.txt
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            reports/
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/

  corpus-independent-check:
    # Needs no Android at all: regenerates the corpus and re-verifies it with poppler/qpdf/pdfium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf fonts-freefont-ttf fonts-dejavu-core
          pip install reportlab pikepdf pypdfium2 pillow cryptography
      - name: Regenerate and verify corpus
        run: |
          python3 tools/corpus/make_corpus.py /tmp/corpus
          python3 tools/corpus/verify_corpus.py /tmp/corpus
