name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Updated from java-version: '11' to '17'
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace --refresh-dependencies --no-build-cache --info

    - name: Dump Kotlin daemon logs on failure
      if: failure()
      run: |
        echo "== Kotlin daemon log files =="
        find /home/runner/.kotlin/daemon -type f 2>/dev/null -print -exec cat {} \; || echo "No daemon log files found at /home/runner/.kotlin/daemon"
        echo "== Gradle daemon log files (fallback) =="
        find /home/runner/.gradle/daemon -name "*.log" -newermt "-15 minutes" 2>/dev/null -print -exec tail -c 20000 {} \; || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    # Room schema JSON is generated by the real Room compiler during the build (room.schemaLocation, see module build.gradle).
    # Fails if none were produced; prints each database's version and entity count so they can be compared with the
    # declared @Database versions. Download artifact `room-schemas` and commit the files at the same paths.
    - name: Validate generated Room schemas
      run: |
        python3 - <<'PY'
        import glob, json, sys
        files = sorted(glob.glob("**/schemas/**/*.json", recursive=True))
        if not files:
            sys.exit("No Room schema JSON was generated: schema export is not working")
        for f in files:
            d = json.load(open(f))["database"]
            print("%-95s version=%s entities=%d" % (f, d["version"], len(d["entities"])))
        print("%d schema files" % len(files))
        PY

    - name: Upload generated Room schemas
      uses: actions/upload-artifact@v4
      with:
        name: room-schemas
        path: "**/schemas/**/*.json"
        if-no-files-found: error
