name: Repository sanity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No empty Gradle, Kotlin or manifest files; every included module has a build file
        run: |
          bad=$(find . \( -name '*.gradle' -o -name '*.kt' -o -name 'AndroidManifest.xml' \) -size 0 -not -path './.git/*')
          if [ -n "$bad" ]; then
            echo "Empty files (a file that was copied or uploaded without its content):"
            echo "$bad"
            exit 1
          fi
          for m in $(grep -oE "include ':[A-Za-z0-9_-]+'" settings.gradle | sed "s/include ':\(.*\)'/\1/"); do
            f="$m/build.gradle"
            custom=$(grep -oE "project\(':$m'\)\.buildFileName *= *'[^']+'" settings.gradle | sed "s/.*= *'\(.*\)'/\1/")
            if [ -n "$custom" ]; then f="$m/$custom"; fi
            if [ ! -s "$f" ]; then
              echo "Module $m: Gradle will use $f, which is missing or empty"
              exit 1
            fi
          done
          echo "OK"
