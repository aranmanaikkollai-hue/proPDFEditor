name: Release build and dependency audit (manual)

# Produces the evidence the audits could not generate offline, and FAILS CLOSED when it cannot:
#   - source fingerprint + commit SHA of the tree actually built
#   - tool self-tests (iText scanner, lint gate, dependency-insight classifier)
#   - an unsigned release APK (R8 + resource shrinking as configured in app/build.gradle)
#   - release lint with a fail-closed gate (missing/malformed report or any Error/Fatal issue fails the job)
#   - the resolved release runtime dependency graphs of :app and :core
#   - dependency insight for iText, PDFBox-Android and Bouncy Castle (Gradle failures are NOT suppressed)
#   - an iText scan of every classes*.dex (plus APK entries and the R8 mapping) that fails if the scan cannot complete
#   - DEPENDENCY_LICENSES.csv built from the POMs of the resolved artifacts
# Manual trigger only. UNTESTED: written without the ability to run it; the first run may need adjustment.
# Evidence steps use `!cancelled()` so one failing gate does not hide the other evidence; any failed step
# still fails the job.
on:
  workflow_dispatch:

jobs:
  release-audit:
    runs-on: ubuntu-24.04
    # shell: bash => `bash -eo pipefail`, so a failure on the left of `| tee` is not masked.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Record commit and source-tree fingerprint (before any build output exists)
        run: |
          # Hash BEFORE creating any output file inside the tree. `| tee reports/source-identity.txt` created that
          # file first, so the earlier fingerprint included a half-written output file (wrong, run-dependent).
          IDENT="$RUNNER_TEMP/source-identity.txt"
          {
            echo "commit_sha=$(git rev-parse HEAD)"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            python3 tools/release/source_fingerprint.py .
          } > "$IDENT"
          mkdir -p reports
          cp "$IDENT" reports/source-identity.txt
          cat "$IDENT"

      - name: Release tool self-tests (scanner, lint gate, dependency-insight classifier)
        run: python3 -W ignore -m unittest discover -s tools/release -p 'test_*.py' -v 2>&1 | tee reports/release-tools-selftest.txt

      - name: Record versions
        run: |
          { java -version 2>&1; ./gradlew --version --no-daemon; python3 --version; } | tee reports/tool-versions.txt

      - name: Assemble release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # No continue-on-error: if the lint task itself fails, the job fails. The root build sets abortOnError false,
      # so the task writes its report even when issues exist; the gate below is what decides.
      - name: Lint (release)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Release lint gate (fails on a missing/malformed report or any Error/Fatal issue)
        if: ${{ !cancelled() }}
        run: |
          python3 tools/release/lint_gate.py app/build/reports/lint-results-release.xml \
            --output reports/lint-gate.txt --json reports/lint-gate.json

      - name: Resolved release runtime dependency graphs
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :app:dependencies  --configuration releaseRuntimeClasspath --no-daemon > reports/deps-app-release.txt
          ./gradlew :core:dependencies --configuration releaseRuntimeClasspath --no-daemon > reports/deps-core-release.txt
          for f in reports/deps-app-release.txt reports/deps-core-release.txt; do
            [ -s "$f" ] || { echo "$f is empty"; exit 1; }
            grep -q "releaseRuntimeClasspath" "$f" || { echo "$f does not contain the releaseRuntimeClasspath graph"; exit 1; }
          done
          grep -q "pdfbox-android" reports/deps-app-release.txt || { echo "pdfbox-android missing from the app release graph: the graph looks wrong"; exit 1; }

      - name: Dependency insight (Gradle failures fail the step; absent is not a failure)
        if: ${{ !cancelled() }}
        run: |
          set +e
          status=0
          : > reports/dependency-insight-summary.txt
          check() {  # module group expectation configuration
            mod="$1"; group="$2"; expect="$3"; config="$4"
            out="reports/insight-${mod}-${config}-${group}.txt"
            ./gradlew ":${mod}:dependencyInsight" --dependency "$group" --configuration "$config" --no-daemon > "$out" 2>&1
            rc=$?
            python3 tools/release/check_dependency_insight.py --report "$out" --exit-code "$rc" \
              --group "$group" --expect "$expect" --label "${mod}:${config}:${group}" | tee -a reports/dependency-insight-summary.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          }
          # Production: iText must be absent from the release runtime classpaths; PDFBox-Android must be present
          # (a positive control, so a broken inspection cannot masquerade as "absent").
          for mod in app core; do
            check "$mod" com.itextpdf    absent  releaseRuntimeClasspath
            check "$mod" com.tom-roush   present releaseRuntimeClasspath
            check "$mod" org.bouncycastle any    releaseRuntimeClasspath
          done
          # Test-only: iText is a documented androidTestImplementation fixture generator. Recorded, not required.
          check app com.itextpdf any debugAndroidTestRuntimeClasspath
          exit $status

      - name: iText scan of the release APK (fails if the scan cannot complete or finds iText)
        if: ${{ !cancelled() }}
        run: |
          APK=$( (ls app/build/outputs/apk/release/*.apk 2>/dev/null || true) | head -1)
          [ -n "$APK" ] || { echo "No release APK found: the iText scan cannot run"; exit 1; }
          python3 tools/release/scan_itext_in_apk.py "$APK" \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --output reports/itext-classes-in-release-dex.txt --json reports/itext-scan.json

      - name: Dependency licence inventory (self-test, then generate)
        if: ${{ !cancelled() }}
        run: |
          # The folder is named tools/licence in this tree; tolerate the American spelling too.
          LICDIR=$( (ls -d tools/licence tools/license 2>/dev/null || true) | head -1)  # `|| true`: with pipefail a missing dir made ls exit 2 and aborted the step
          echo "licence tools folder: $LICDIR"
          python3 "$LICDIR/test_generate_dependency_licenses.py"
          python3 "$LICDIR/generate_dependency_licenses.py" \
            --deps reports/deps-app-release.txt reports/deps-core-release.txt \
            --cache "$HOME/.gradle/caches/modules-2/files-2.1" \
            --out reports/DEPENDENCY_LICENSES.csv

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit
          path: |
            reports/
            app/build/outputs/apk/release/
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.*
